name: daily

# 盈利修正 · 修正速度与纳指：每个美股交易日自动重算，发布到 GitHub Pages。
#
# 分工：GitHub 负责算，Claude 负责推送。
#   · 本工作流：北京时间工作日抓新周报和纳指 → 重算 → 页面发布到
#     https://chaodu211-cell.github.io/earnings-revision/ ，同目录另有 status.json（各数据截至日、抓取是否成功）。
#   · Claude 的定时任务：北京时间 20:50 读取上面那个页面，更新 Artifact，推送到手机。
#
# Actions 的 cron 曾晚到数小时。主运行提前，另设两个错开整点的补跑。
# 仍可用 workflow_dispatch 手动触发；定时补跑按线上数据截止日判断是否跳过。
#
# txt/（FactSet 周报原文，版权内容）不进 git，仓库里只有本地全量解析出来的 factset_weekly.csv。
# 这里每次只抓 CSV 最新一期之后的周报（fetch_factset.py --since-csv），追加解析（parse_factset.py --incremental），
# 新抓的 txt/ 用 actions/cache 在两次运行之间保存。本地推上来更新过的 factset_weekly.csv 之后，这里自然从那一期往后接。
# 算出来的页面和中间文件只发布、不提交；提交回 main 的只有 Yahoo 成分股快照（只由这里写，每个交易日一份）。
on:
  schedule:
    # 纽约时间：周日至周四 22:23（北京已是下个工作日）主更新；周一至周五 03:43、06:23 补跑。
    - cron: "23 22 * * 0-4"
      timezone: "America/New_York"
    - cron: "43 3 * * 1-5"
      timezone: "America/New_York"
    - cron: "23 6 * * 1-5"
      timezone: "America/New_York"
  # 代码合进 main 就重建页面（只改文档不触发）；这种运行不拍 Yahoo 快照
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write   # 只用来提交 Yahoo 快照：yahoo/、yahoo_agg.csv、yahoo_sector.csv，以及上修初期名单记录 early_log.csv、early_px.csv
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  # 定时补跑检查线上纳指收盘日、行情抓取状态和今天的 Yahoo 快照。
  # 代码推送和手动运行照常；读不到状态时照跑。
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - if: ${{ github.event_name == 'schedule' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: yahoo
      - id: check
        if: ${{ github.event_name == 'schedule' }}
        run: |
          curl -fsS --retry 3 "https://chaodu211-cell.github.io/earnings-revision/status.json?t=$(date +%s)" -o status.json || exit 0
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          st = json.load(open("status.json", encoding="utf-8"))
          now = datetime.now(ZoneInfo("America/New_York"))
          expected = now.date()
          if (now.hour, now.minute) < (16, 30):
              expected -= timedelta(days=1)
          # 周末回退到周五；遇交易所假日或源数据未齐时，保留补跑机会。
          while expected.weekday() >= 5:
              expected -= timedelta(days=1)
          bj = now.astimezone(ZoneInfo("Asia/Shanghai"))
          snap_done = os.path.exists(f"yahoo/{bj:%Y-%m-%d}.csv")
          # 与定时快照步骤的闸门一致。
          blocked = bj.weekday() >= 5 or (now.weekday() < 5 and 900 <= now.hour * 100 + now.minute < 1630)
          nasdaq = st.get("nasdaq") or ""
          skip = bool(st.get("prices_ok")) and nasdaq >= expected.isoformat() and (snap_done or blocked)
          print(f"线上纳指截至 {nasdaq}，预期至少 {expected}；北京 {bj:%m-%d} 的快照"
                f"{'已有' if snap_done else '还没有'} → " + ("已发布，跳过" if skip else "继续更新"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          PY

  build:
    needs: check
    if: ${{ needs.check.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai       # 页面「生成时间」、快照日期和本地 Mac 一样按北京时间
      EI_PROXY: ""            # FactSet 直连（本地才走 Veee）
      REV_FORCE_FETCH: "1"    # 标普、纳指每次重下，下载失败才退回缓存
      PYTHONWARNINGS: ignore
    outputs:
      built: ${{ steps.site.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # 不开 cache: pip —— 仓库没有 requirements.txt，开了会直接报错
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装依赖
        run: pip install pandas numpy scipy pymupdf yfinance

      # key 每次轮换（key 不可变，固定 key 会让缓存永远停在第一天），restore-keys 前缀回退到最近一次
      - name: 取回缓存（新抓的周报文字、标普 / 纳指日线）
        uses: actions/cache/restore@v4
        with:
          path: |
            txt
            _spx.csv
            _nasdaq.csv
            _members_px.csv
          key: rev-${{ github.run_id }}
          restore-keys: |
            rev-

      # 快照和页面共用同一份成分股名单；push 不拍快照，也需要它显示行业。
      - name: 下载成分股名单与行业
        run: |
          if curl -sS --fail --retry 3 -o "$RUNNER_TEMP/sectors.json" \
            https://raw.githubusercontent.com/chaodu211-cell/best-weights/main/sectors.json; then
            echo "REV_SECTORS=$RUNNER_TEMP/sectors.json" >> "$GITHUB_ENV"
          else
            rm -f "$RUNNER_TEMP/sectors.json"
            echo "::warning::sectors.json 下载失败，Yahoo 快照可能无法更新，上修广度表不显示行业"
          fi

      # 定时任务晚到盘中或北京时间周末时不拍 Yahoo 快照，避免抢占下次盘前的日期。
      # 手动和显式刷新保留原规则：美东盘中且北京日期已领先时才拦。
      - name: ① Yahoo 成分股快照
        id: snap
        # 显式刷新提交也拍快照；普通代码推送仍只重建页面。
        if: ${{ !cancelled() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]')) }}
        continue-on-error: true
        run: |
          set -o pipefail
          if [ -f "yahoo/$(date +%F).csv" ]; then echo "今天（$(date +%F)）已拍过"; exit 0; fi
          ET_DOW=$(TZ=America/New_York date +%u); ET_HM=$(TZ=America/New_York date +%H%M)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date +%u)" -gt 5 ]; then
            echo "北京 $(date +%F) 是周末，跳过定时快照"
            echo "guard=weekend" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ET_DOW" -le 5 ] && [ "$((10#$ET_HM))" -ge 900 ] && [ "$((10#$ET_HM))" -lt 1630 ] \
             && { [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$(date +%F)" != "$(TZ=America/New_York date +%F)" ]; }; then
            echo "美东 $(TZ=America/New_York date '+%a %H:%M')，跳过盘中快照"
            echo "guard=market_hours" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          timeout 20m python3 yahoo_snapshot.py 2>&1 | tee snap.log | tail -2

      - name: ② 抓新周报
        id: fetch
        continue-on-error: true   # 抓不到就用已有的周报照样重算；是否被挡看 status.json 的 factset_http
        run: |
          set -o pipefail
          timeout 40m python3 fetch_factset.py --since-csv 2>&1 | tee fetch.log

      - name: ③ 重算并生成页面
        env:
          REV_YAHOO_FETCH: ${{ steps.snap.outputs.guard || steps.snap.outcome }}
        run: |
          set -eo pipefail
          python3 parse_factset.py --incremental 2>&1 | tee build.log
          python3 analyze.py 2>&1 | tee -a build.log | tail -3
          python3 realtime.py 2>&1 | tee -a build.log | tail -1
          # speed.py 直接读 _nasdaq.csv，先刷新
          python3 -c "import make_chart; make_chart.nasdaq()" 2>&1 | tee -a build.log | tail -3
          python3 speed.py 2>&1 | tee -a build.log | tail -1
          python3 make_chart.py 2>&1 | tee -a build.log | grep html
          grep -h PRICE_FALLBACK build.log | sed 's/^/::warning::/' || true

      # 抓完、算完立刻存缓存——后面任何一步失败都不该把今天抓到的周报丢掉
      - name: 保存缓存
        if: ${{ !cancelled() && hashFiles('_nasdaq.csv', 'txt/*.txt') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            txt
            _spx.csv
            _nasdaq.csv
            _members_px.csv
          key: rev-${{ github.run_id }}

      - name: 校验产物
        run: |
          python3 - <<'PY'
          import datetime, io, json, sys
          s = io.open("修正速度与纳指.html", encoding="utf-8").read()
          if len(s) < 1_000_000:
              sys.exit(f"页面只有 {len(s)} 字节，疑似生成失败")
          i = s.find("const D = ")
          if i < 0 or "/*DATA*/" in s:
              sys.exit("页面里没有嵌入数据（const D = /*DATA*/ 没被替换）")
          d = json.JSONDecoder().raw_decode(s, i + len("const D = "))[0]
          if len(d["weekly"]) < 500:   # 纯修正 2016-04 起，2026-10 时 549 行
              sys.exit(f"周度数据只有 {len(d['weekly'])} 行，疑似周报解析出错")
          f = d["fresh"]
          age = (datetime.date.today() - datetime.date.fromisoformat(f["nasdaq"])).days
          if age > 5:
              print(f"::warning::纳指截至 {f['nasdaq']}，已 {age} 天没更新")
          cur = d["speed"]["rt|8|1.0"]["current"]
          print(f"周报截至 {f['factset']}　纳指截至 {f['nasdaq']}　纯修正 {d['latest']['x13']}%"
                f"（{d['latest']['pctile']}% 分位）　阶段 {cur['phase']}（自 {cur['since']} 起）")
          PY

      - name: 准备 Pages 目录
        id: site
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          SNAP_OUTCOME: ${{ steps.snap.outcome }}
          SNAP_GUARD: ${{ steps.snap.outputs.guard }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p _site
          cp 修正速度与纳指.html _site/index.html
          # status.json 给 Claude 的定时任务用：分得清「休市 / 周报还没发」和「今天抓取失败」
          python3 - <<'PY'
          import io, json, os, re
          s = io.open("修正速度与纳指.html", encoding="utf-8").read()
          i = s.index("const D = ")
          d = json.JSONDecoder().raw_decode(s, i + len("const D = "))[0]
          read = lambda p: io.open(p, encoding="utf-8").read() if os.path.exists(p) else ""
          fl, bl = read("fetch.log"), read("build.log")
          m = re.search(r"^HTTP_STATUS (.*)$", fl, re.M)
          http = ({k: int(v) for k, v in (kv.split(":", 1) for kv in m.group(1).split())}
                  if m and m.group(1) != "none" else {})
          st = {"generated": d["fresh"]["generated"],
                "factset": d["fresh"]["factset"],   # 最新一期周报落款日
                "nasdaq": d["fresh"]["nasdaq"],     # 纳指最新收盘日
                "yahoo": ((d.get("breadth") or {}).get("latest") or {}).get("date"),   # 实际用于页面的快照日期
                "new_reports": re.findall(r"->\s+(\d{4}-\d{2}-\d{2}) hub", fl),   # 本次新抓到的周报
                "factset_fetch_ok": os.environ["FETCH_OUTCOME"] == "success",
                "factset_http": http,               # 404 = 还没发布；有 403/429/err 而没有 200 → 多半被挡
                "prices_ok": "PRICE_FALLBACK" not in bl,   # False = 标普/纳指下载失败，用的是缓存
                "snapshot": os.environ.get("SNAP_GUARD") or os.environ.get("SNAP_OUTCOME") or "skipped",   # market_hours = 盘中闸门没拍
                "run_url": os.environ["RUN_URL"], "event": os.environ.get("GITHUB_EVENT_NAME"),
                "sha": os.environ.get("GITHUB_SHA")}
          json.dump(st, io.open("_site/status.json", "w", encoding="utf-8"), ensure_ascii=False)
          print(st)
          PY
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      # 快照历史只增不改，必须跨运行保存。推送失败会让本次运行标红（GitHub 会发邮件）；页面发布不受影响。
      - name: 提交 Yahoo 快照
        if: ${{ !cancelled() && steps.snap.outcome == 'success' }}
        run: |
          git add -- yahoo yahoo_agg.csv yahoo_sector.csv early_log.csv early_px.csv
          if git diff --cached --quiet; then
            echo "快照无新增"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Yahoo 快照 + 上修初期名单：$(date +%F)"
          # --autostash：流水线刚重写过受跟踪的 factset_weekly.csv 等文件，不带它 rebase 会以「有未提交改动」拒绝
          for i in 1 2 3; do
            if git pull --rebase --autostash --quiet origin main && git push --quiet origin HEAD:main; then
              echo "已提交 Yahoo 快照 $(date +%F)"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "推送失败，重试 $i"
            sleep $((i * 5))
          done
          echo "::error::Yahoo 快照推送失败：今天这份只存在于本次运行里，快照历史会缺这一天"
          exit 1

      - name: 运行摘要
        if: always()
        run: |
          {
            echo "## 盈利修正 · 每日刷新"
            for f in fetch.log build.log snap.log; do
              [ -f "$f" ] || continue
              echo
              echo "### $f"
              echo '```'
              tail -25 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    # 只要页面产物传上去了就发布，哪怕后面「提交 Yahoo 快照」失败
    if: ${{ !cancelled() && needs.build.outputs.built == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
